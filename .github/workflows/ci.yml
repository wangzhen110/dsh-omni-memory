name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.13', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # check-update-log walks every commit; a shallow clone makes that gate
          # silently pass without checking anything.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: install dependencies
        run: npm ci
      - name: syntax + documentation gates
        run: npm run check
      - name: tests
        run: npm test
      - name: retrieval quality gate
        run: npm run bench:golden
